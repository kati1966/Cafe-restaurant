<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ثبت‌نام | کافه رستوران من</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>

        <div class="logo">
            کافه رستوران من ☕
        </div>

        <button class="menu-toggle" id="menu-toggle" aria-label="باز کردن منو">
            ☰
        </button>

        <nav id="main-nav">
            <ul>
                <li><a href="index.html">خانه</a></li>
                <li><a href="index.html#menu">منوی کافه</a></li>
                <li><a href="about.html">درباره ما</a></li>
                <li><a href="gallery.html">گالری</a></li>
                <li><a href="contact.html">تماس با ما</a></li>
            </ul>
        </nav>

        <div class="user-actions">
            <a href="login.html">ورود</a>
            <a href="register.html">ثبت‌نام</a>
        </div>

        <a href="cart.html" class="cart">
            🛒 سبد خرید
            <span id="cart-count">0</span>
        </a>

    </header>


    <main class="register-page">

        <div class="register-box">

            <h1>ایجاد حساب کاربری</h1>

            <p class="register-intro">
                برای عضویت در کافه رستوران من، اطلاعات خود را وارد کنید.
            </p>

            <form id="register-form">

                <div class="form-group">
                    <label for="fullname">نام و نام خانوادگی</label>
                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="نام و نام خانوادگی"
                        required>
                </div>

                <div class="form-group">
                    <label for="register-email">ایمیل</label>
                    <input
                        type="email"
                        id="register-email"
                        name="email"
                        placeholder="ایمیل خود را وارد کنید"
                        required>
                </div>

                <div class="form-group">
                    <label for="register-password">رمز عبور</label>
                    <input
                        type="password"
                        id="register-password"
                        name="password"
                        placeholder="رمز عبور"
                        required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">تکرار رمز عبور</label>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="رمز عبور را دوباره وارد کنید"
                        required>
                </div>

                <button type="submit" class="register-btn">
                    ثبت‌نام
                </button>

            </form>

            <p class="login-link">
                قبلاً حساب کاربری دارید؟
                <a href="login.html">وارد شوید</a>
            </p>

        </div>

    </main>


    <footer>
        <p>© 2026 کافه رستوران من | تمامی حقوق محفوظ است.</p>
    </footer>


    <script src="js/script.js"></script>

</body>

</html>
