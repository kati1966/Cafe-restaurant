<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ورود | کافه رستوران من</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>

        <div class="logo">
            کافه رستوران من ☕
        </div>

        <button class="menu-toggle" id="menu-toggle" aria-label="باز کردن منو">
            ☰
        </button>

        <nav id="main-nav">
            <ul>
                <li><a href="index.html">خانه</a></li>
                <li><a href="index.html#menu">منوی کافه</a></li>
                <li><a href="about.html">درباره ما</a></li>
                <li><a href="gallery.html">گالری</a></li>
                <li><a href="contact.html">تماس با ما</a></li>
            </ul>
        </nav>

        <div class="user-actions">
            <a href="login.html">ورود</a>
            <a href="register.html">ثبت‌نام</a>
        </div>

        <a href="cart.html" class="cart">
            🛒 سبد خرید
            <span id="cart-count">0</span>
        </a>

    </header>


    <main class="login-page">

        <div class="login-box">

            <h1>ورود به حساب کاربری</h1>

            <p class="login-intro">
                برای ادامه، اطلاعات حساب خود را وارد کنید.
            </p>

            <form id="login-form">

                <div class="form-group">
                    <label for="email">ایمیل</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="ایمیل خود را وارد کنید"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">رمز عبور</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="رمز عبور خود را وارد کنید"
                        required>
                </div>

                <div class="remember-me">
                    <label>
                        <input type="checkbox" id="remember">
                        مرا به خاطر بسپار
                    </label>
                </div>

                <button type="submit" class="login-btn">
                    ورود
                </button>

            </form>

            <p class="register-link">
                حساب کاربری ندارید؟
                <a href="register.html">ثبت‌نام کنید</a>
            </p>

        </div>

    </main>


    <footer>
        <p>© 2026 کافه رستوران من | تمامی حقوق محفوظ است.</p>
    </footer>


    <script src="js/script.js"></script>

</body>

</html>
